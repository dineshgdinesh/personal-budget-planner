<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Budget Planner</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4f7;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e7ffe7;
            border-left: 5px solid #4CAF50;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Personal Budget Planner</h2>

    <label>Monthly Income</label>
    <input type="number" id="income" placeholder="Enter your monthly income">

    <label>Total Expenses</label>
    <input type="number" id="expenses" placeholder="Enter your total monthly expenses">

    <button onclick="calculateBudget()">Calculate Remaining Balance</button>

    <div class="result" id="resultBox" style="display:none;">
        <h3>Your Monthly Summary</h3>
        <p id="remaining"></p>
    </div>
</div>

<script>
    function calculateBudget() {
        let income = document.getElementById("income").value;
        let expenses = document.getElementById("expenses").value;

        if (income === "" || expenses === "") {
            alert("Please enter both income and expenses");
            return;
        }

        let remaining = income - expenses;

        document.getElementById("resultBox").style.display = "block";

        if (remaining >= 0) {
            document.getElementById("remaining").innerHTML =
                "You are saving ₹" + remaining + " this month 🎉";
        } else {
            document.getElementById("remaining").innerHTML =
                "You are overspending by ₹" + Math.abs(remaining) + " ⚠️";
        }
    }
</script>

</body>
</html>
